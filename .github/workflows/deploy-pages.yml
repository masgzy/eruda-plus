# ============================================================================
# Build the VitePress site (site/) and deploy it to GitHub Pages.
#
# Pipeline mirrors EasyTier's deploy workflow (VitePress + official Pages
# Actions) with two fixes/extra:
#   - `branches: [main]` — EasyTier's own workflow ships a corrupted
#     `branches: ain]` trigger; deploys only fired via manual dispatch there.
#   - The CNAME file ships from site/public/ so the custom domain
#     (eruda.cc.cd) is applied on every deploy, and we re-register it via
#     the Pages API (idempotent) because workflow deploys need it set
#     explicitly on the Pages site.
#
# No manual repo setting needed: `configure-pages` runs with `enablement:
# true`, so the workflow's own GITHUB_TOKEN (pages: write) turns the Pages
# source on automatically on first deploy.
#
# Custom domain DNS (eruda.cc.cd):
#   CNAME  eruda.cc.cd  →  masgzy.github.io.
# ============================================================================

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'dist/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # lastUpdated needs full git history
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Self-service: enable Pages with the "GitHub Actions" source
          # if it is not enabled yet (no manual step required).
          enablement: true

      - name: Register custom domain
        run: |
          # The CNAME file alone is not enough for workflow deployments:
          # register eruda.cc.cd on the Pages site explicitly (idempotent).
          code=$(curl -s -o /tmp/pages-resp.json -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"cname":"eruda.cc.cd","build_type":"workflow"}')
          echo "PATCH /pages -> $code"
          cat /tmp/pages-resp.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build VitePress site
        working-directory: site
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
